<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0</title>
</head>

<body>
    <script>
        let n = prompt("0보다 큰 정수 입력", 0);
        n = parseInt(n);
        let i = 0, sum = 0;
        do {
            sum += i;
            i++;
        } while (i <= n);
        document.write("<div style='width: 300px; height: 200px; border: 5px solid #333; '><p>0에서 " + n + "까지의 합은 " + sum + "입니다.</p></div>");
    </script>
</body>

</html>
