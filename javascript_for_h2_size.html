<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for문 글자크기</title>
</head>

<body>
    <h1>글자 크기 출력</h1>
    <script>
        for (let size = 5; size <= 100; size += 5) {
            document.write("<h2 ");
            document.write("style= 'font-size:" + size + "px'>");
            document.write(size + "픽셀이다.");
            document.write("</h2>");
        }
    </script>
</body>

</html>
