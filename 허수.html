<!DOCTYPE html>
<html>
  <head>
    <title>허수</title>
  </head>
  <body>
      <h1 class="title">Hello World!</h1>
      <script>
        let title = document.querySelector('.title');
        console.log('김구름')

        class Complex {
          constructor(re, im) {
            this.re = re;
            this.im = im;
          }

          add(other) {
            return new Complex(this.re + other.re, this.im + other.im);
          }

          multiply(other) {
            return new Complex (this.re * other.re - this.im * other.im, this.re * other.im + this.im * other.re);
          }

          toString() {
            return `${this.re} ${this.im >= 0 ? '+' : '-'} ${Math.abs(this.im)}i`;
          }
          
        }
        // 사용 예시
        const z1 = new Complex(3, 4);  
        // 3 + 4i
        const z2 = new Complex(1, -2); // 1 - 2i
        const inumber = z1.add(z2).toString();
        title.innerText = inumber;
      </script>
  </body>
</html>
